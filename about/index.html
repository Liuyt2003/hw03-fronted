<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>About · Acme Corp</title>
    <link rel="stylesheet" href="/common.css" />
  </head>

  <body>
    <header id="site-header"></header>

    <main>
      <div id="app">
        <div>
          <h1 class="page-title">About</h1>

          <p class="intro-text">
            Founded in a desert canyon in 1949, Acme Corp pioneered the field of
            mail-order improbability. Our engineers work in shifts so the lab is
            never empty (and so the test rockets always have a witness).
          </p>

          <h2 class="section-title">The team</h2>

          <ul class="team-list" id="team-list"></ul>
        </div>
      </div>
    </main>

    <footer>© 2026 Acme Corp. All rights reserved.</footer>

    <script>
      const teamList = document.getElementById("team-list");

      fetch("http://127.0.0.1:8000/api/team")
        .then((response) => {
          if (!response.ok) {
            throw new Error("Failed to load team");
          }

          return response.json();
        })
        .then((team) => {
          if (team.length === 0) {
            teamList.innerHTML = `
              <li class="case-empty">
                No team members yet.
              </li>
            `;

            return;
          }

          teamList.innerHTML = team
            .map((member) => {
              return `
                <li class="team-item">
                  <img
                    class="team-avatar"
                    src="${member.image}"
                    alt="${member.name}"
                  />

                  <div>
                    <h3 class="team-name">
                      ${member.name}
                    </h3>

                    <p class="team-title">
                      ${member.title}
                    </p>
                    <div class="team-bio">
                      ${member.bio.map((paragraph) => `<p>${paragraph}</p>`).join("")}
                    </div>
                  </div>
                </li>
              `;
            })
            .join("");
        })
        .catch((error) => {
          console.error(error);

          teamList.innerHTML = `
            <li class="case-empty">
              Failed to load team members.
            </li>
          `;
        });
    </script>

    <script src="/nav.js"></script>
  </body>
</html>
